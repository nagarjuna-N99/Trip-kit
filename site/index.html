<title>Three Cities Trip Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar over one scrolling column; city colors tag every item (Taiwan = jade, Hong Kong = harbour blue, Macau = lantern amber); booked items sit in a green-edged strip. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17211f; --muted:#5d6b67; --line:#dbe2df;
  --tw:#0f7a5c; --hk:#1f5fa8; --mo:#b5620b; --accent:#0f7a5c; --accent-fg:#ffffff; --danger:#b3261e; --warn:#8a5a00;
  --tw-bg:#e0f1ea; --hk-bg:#e1ebf7; --mo-bg:#f8e9d6; --warn-bg:#fdf1d6;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --han:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18211f; --fg:#e8efec; --muted:#98a8a3; --line:#2b3835;
  --tw:#4cc9a0; --hk:#79aef0; --mo:#f0a95a; --accent:#4cc9a0; --accent-fg:#0b1311; --danger:#ff8a80; --warn:#f2c46b;
  --tw-bg:#173128; --hk-bg:#182638; --mo-bg:#3a2a16; --warn-bg:#3a2f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18211f; --fg:#e8efec; --muted:#98a8a3; --line:#2b3835;
  --tw:#4cc9a0; --hk:#79aef0; --mo:#f0a95a; --accent:#4cc9a0; --accent-fg:#0b1311; --danger:#ff8a80; --warn:#f2c46b;
  --tw-bg:#173128; --hk-bg:#182638; --mo-bg:#3a2a16; --warn-bg:#3a2f14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
header{padding:20px 0 12px}
h1{font:700 26px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.count{display:inline-block;margin-top:10px;font:600 13px var(--body);background:var(--tw-bg);color:var(--tw);padding:5px 12px;border-radius:999px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{padding-top:18px}
h2{font:700 19px var(--display);margin:0 0 10px}
h3{font:700 15px var(--display);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
input,select{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text],input[type=number]{flex:1 1 120px}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px;line-height:1}
.x:hover{color:var(--danger)}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.tag.Taiwan{background:var(--tw-bg);color:var(--tw)} .tag.HongKong{background:var(--hk-bg);color:var(--hk)} .tag.Macau{background:var(--mo-bg);color:var(--mo)}
.tag.today{background:var(--accent);color:var(--accent-fg)}
.day{border-left:4px solid var(--line)}
.day.Taiwan{border-left-color:var(--tw)} .day.HongKong{border-left-color:var(--hk)} .day.Macau{border-left-color:var(--mo)}
.day.now{outline:2px solid var(--accent)}
.day-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.day-head .date{font:600 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.day-title{font:700 17px/1.25 var(--display);margin:0 0 8px;overflow-wrap:anywhere}
.booked{background:var(--tw-bg);border-radius:8px;padding:8px 10px;margin:0 0 6px;font-size:13px;overflow-wrap:anywhere}
.booked b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tw);margin-right:6px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.heads{background:var(--warn-bg);color:var(--fg);border-radius:8px;padding:8px 10px;margin:6px 0 0;font-size:13px;overflow-wrap:anywhere}
.heads b{color:var(--warn)}
.item{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.item .t{color:var(--muted);font-variant-numeric:tabular-nums;width:78px;flex:0 0 78px;font-size:13px;padding-top:2px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rates label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.conv div{background:var(--bg);border-radius:8px;padding:10px}
.conv b{display:block;font:700 20px var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.conv span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.total{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.exp{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.exp .d{flex:1;min-width:0;overflow-wrap:anywhere}
.exp .a{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.group-title{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.phrase .en{font-weight:500}
.phrase .han{font:500 20px var(--han)}
.phrase .rom{color:var(--muted);font-size:13px}
.phrase button{grid-row:1/3;grid-column:2}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tips .card{margin:0}
.tips ul{margin:8px 0 0;padding-left:18px}
.tips li{margin-bottom:5px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:8px 14px;font:500 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{font-weight:700;background:var(--tw-bg)}
.ref{font-size:12px;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.maplink{color:var(--accent);font:600 12px var(--body);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(76px,calc(env(safe-area-inset-bottom,0px) + 70px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font:500 14px var(--body);opacity:0;pointer-events:none;z-index:30;transition:opacity .2s}
.layout{display:block}
.notes{display:none;background:var(--surface);border:1px solid var(--line);padding:12px;flex-direction:column;gap:6px}
.notes-head{display:flex;align-items:center;gap:8px}
.notes-head h3{flex:1}
.notes textarea,.daynote{font:15px/1.5 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;resize:vertical}
.notes textarea{flex:1;min-height:220px}
.daynote{min-height:70px;display:block;margin:0}
.daynote[hidden]{display:none!important}
.notes #noteExport{flex:none;min-height:110px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:999px;padding:11px 20px}
.notes.open{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:75vh;border-radius:14px 14px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:1100px){
  .layout{display:grid;grid-template-columns:minmax(0,760px) 330px;gap:24px;justify-content:center}
  .notes{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;margin-top:20px;height:calc(100vh - 40px);max-height:700px;border-radius:10px}
  .notes.open{position:sticky;left:auto;right:auto;bottom:auto;max-height:700px;border-radius:10px;z-index:auto}
  .fab,#noteClose{display:none}
}
details.g{margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.g>summary{cursor:pointer;font:600 13px var(--body);padding:9px 12px;list-style:none;display:flex;gap:8px;align-items:center}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::before{content:"▸";color:var(--muted)}
details.g[open]>summary::before{content:"▾"}
.leg{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.leg b{display:block;font-size:14px}
.leg .m{color:var(--muted)}
.leg .tx{display:inline-block;margin-top:3px;font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.leg .tx.free{background:var(--tw-bg);color:var(--tw)}
.near{margin:0;padding:8px 12px 10px 30px;border-top:1px solid var(--line);font-size:13px}
.near li{margin-bottom:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{color:var(--accent);font-weight:600;font-size:14px}
</style>

<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<div class="layout">
<div class="wrap">
<header>
  <h1>Three Cities Trip Kit</h1>
  <p class="sub">Hyderabad to Taiwan, Macau and Hong Kong and back. Dec 16, 2026 to Jan 5, 2027. Everything you tick or type saves in this browser.</p>
  <span class="count" id="count"></span>
  <p class="muted" style="margin:8px 0 0"><span id="liveStat"></span> <button class="btn ghost" id="liveBtn" style="padding:4px 10px;font-size:12px">Refresh</button></p>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="main"></main>
</div>
<aside class="notes" id="notes" aria-label="Trip notes">
  <div class="notes-head"><h3>Trip notes</h3><span class="muted" id="noteState">Saved</span><button class="x" id="noteClose" aria-label="Close notes">×</button></div>
  <textarea id="noteText" placeholder="Jot down anything: booking numbers, addresses, what to ask the hostel, things to buy..."></textarea>
  <div class="row"><button class="btn ghost" id="noteCopy">Copy all notes</button></div>
  <textarea id="noteExport" class="daynote" rows="6" readonly hidden aria-label="All notes"></textarea>
  <p class="muted" style="margin:6px 0 0">Stays open while you switch tabs. Saved in this browser.</p>
</aside>
</div>
<button class="btn fab" id="noteOpen">Notes</button>

  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);

}

  const perHigh=high/days;
  const dayCard=h('div',{class:'card'},h('h3',{style:'margin-bottom:6px'},'Spending by day'),
    h('p',{class:'muted',style:'margin:0 0 6px'},'Daily target: about INR '+inr(low/days)+'–'+inr(perHigh)+'. Log each expense with its date.'));
  const keys=Object.keys(byDay).filter(Boolean).sort();
  if(!keys.length)dayCard.append(h('p',{class:'muted',style:'margin:0'},'No dated spending yet.'));
  keys.forEach(k=>{
    const dd=S.days.find(x=>k>=x.iso&&k<=(x.iso2||x.iso)),v=byDay[k];
    dayCard.append(h('div',{style:'padding:6px 0;border-top:1px solid var(--line)'},
      h('div',{class:'row',style:'justify-content:space-between'},h('span',null,fdate(k)+(dd?' · '+dd.city:'')),h('b',{style:v>perHigh?'color:var(--danger)':''},'INR '+inr(v))),
      h('div',{class:'bar','aria-hidden':'true',style:'margin:4px 0 0'},h('i',{style:'width:'+Math.min(100,v/perHigh*100)+'%'}))));
  });
  const cash=cashCard();
  return [h('h2',null,'Money'),budget,dayCard,cash,converter,exp,rates];
}

// ---------- packing ----------
function renderPack(){
  const out=[h('h2',null,'Packing')];
  let n=0,t=0;Object.values(S.pack).forEach(l=>l.forEach(i=>{t++;if(i[1])n++}));
  out.push(h('div',{class:'bar','aria-hidden':'true'},h('i',{style:'width:'+(t?n/t*100:0)+'%'})),h('p',{class:'muted'},n+' of '+t+' packed'));
  Object.entries(S.pack).forEach(([g,list])=>{
    const card=h('div',{class:'card'},h('p',{class:'group-title'},g));
    list.forEach((it,i)=>card.append(h('div',{class:'item'+(it[1]?' done':''),style:i===0?'border-top:0':''},
      h('input',{type:'checkbox',checked:!!it[1],'aria-label':it[0],onchange:e=>{it[1]=e.target.checked?1:0;save();render()}}),
      h('span',{class:'txt'},it[0]),
      h('button',{class:'x','aria-label':'Remove item',onclick:()=>{list.splice(i,1);save();render()}},'×'))));
    const x=h('input',{type:'text',placeholder:'Add to '+g.toLowerCase(),id:'p'+g.replace(/\W/g,'')});
    const add=()=>{if(x.value.trim()){list.push([x.value.trim(),0]);save();render()}};
    x.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
    card.append(h('div',{class:'row',style:'margin-top:8px'},x,h('button',{class:'btn ghost',onclick:add},'Add')));
    out.push(card);
  });
  return out;
}

// ---------- render ----------
// private details: kept out of the public build and moved by copy and paste
function applyPriv(){
  const p=S.priv;if(!p)return;
  if(Array.isArray(p.bookings))BOOKINGS=p.bookings;
  if(Array.isArray(p.lodging))LODGING=p.lodging;
  if(p.dayBookings)S.days.forEach(d=>{if(p.dayBookings[d.iso])d.bookings=p.dayBookings[d.iso]});
}
function exportPriv(){
  const dayBookings={};S.days.forEach(d=>{if(d.bookings&&d.bookings.length)dayBookings[d.iso]=d.bookings});
  return JSON.stringify({v:1,bookings:BOOKINGS,lodging:LODGING,dayBookings,addr:S.addr||{},info:S.info||{}});
}
function importPriv(text){
  const p=JSON.parse(text);
  if(!p||p.v!==1||!Array.isArray(p.bookings)||!Array.isArray(p.lodging))throw new Error('bad');
  S.priv={bookings:p.bookings,lodging:p.lodging,dayBookings:p.dayBookings||{}};
  S.addr=Object.assign(S.addr||{},p.addr||{});S.info=Object.assign(S.info||{},p.info||{});
  applyPriv();save();render();
}
function render(){
  renderTabs();countdown();setLiveStat();
  const r={now:renderNow,info:renderInfo,shop:renderShop,share:renderShare,plan:renderPlan,go:renderGo,book:renderBook,money:renderMoney,pack:renderPack,talk:renderTalk,tips:renderTips}[S.tab]||renderPlan;
  const y=window.scrollY;
  main.replaceChildren(h('section',null,...r()));
  window.scrollTo({top:y});
}

const nt=document.getElementById('noteText'),ns=document.getElementById('noteState'),np=document.getElementById('notes');

nt.addEventListener('input',()=>{S.notes=nt.value;ns.textContent='Saving…';clearTimeout(nTimer);nTimer=setTimeout(()=>{save();ns.textContent='Saved'},400)});
document.getElementById('noteOpen').addEventListener('click',()=>{np.classList.add('open');nt.focus()});
document.getElementById('noteClose').addEventListener('click',()=>np.classList.remove('open'));
document.getElementById('noteCopy').addEventListener('click',()=>{
  const parts=[];

  S.days.forEach(d=>{if(d.myNote)parts.push(d.date+' · '+d.title+'\n'+d.myNote)});
  const text=parts.join('\n\n')||'No notes yet.';

addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TABS.some(t=>t[0]===x)&&x!==S.tab){S.tab=x;render()}});

render();
