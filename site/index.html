<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a5c">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Kit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex,nofollow">
<title>Three Cities Trip Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: one calm column, big rounded cards, a floating bottom bar with four places (Today, Plan, Money, More). City colour gradients (Taiwan jade, Hong Kong blue, Macau amber) mark where you are. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --fg:#0F1729; --muted:#5B6478; --line:#E3E7EE;
  --accent:#0F1729; --accent-fg:#FFFFFF; --link:#1D55D0; --danger:#C62828; --warn:#8A5A00; --warn-bg:#FFF3D6; --soft:#EDF0F6;
  --tw:#0A8F6E; --hk:#2457D6; --mo:#C26400; --tw-bg:#DDF5EC; --hk-bg:#E1EAFF; --mo-bg:#FFEBD0;
  --g-Taiwan:linear-gradient(140deg,#0A8F6E 0%,#2DC9A0 100%);
  --g-HongKong:linear-gradient(140deg,#2457D6 0%,#6CA0FF 100%);
  --g-Macau:linear-gradient(140deg,#D96F00 0%,#FFB347 100%);
  --shadow:0 8px 28px rgba(15,23,41,.07); --nav-bg:rgba(255,255,255,.82);
  --mesh:radial-gradient(700px 420px at 6% -8%,rgba(10,143,110,.16),transparent 62%),radial-gradient(640px 420px at 100% 0%,rgba(36,87,214,.13),transparent 60%),radial-gradient(600px 400px at 60% 112%,rgba(217,111,0,.09),transparent 60%);
  --display:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif; --han:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1018; --surface:#141B27; --fg:#EEF1F7; --muted:#93A0B8; --line:#242E3F;
  --accent:#EEF1F7; --accent-fg:#0B1018; --link:#82AFFF; --danger:#FF8F87; --warn:#F3C46F; --warn-bg:#3A2F14; --soft:#1B2433;
  --tw:#4DD2AA; --hk:#82AFFF; --mo:#F4AE5E; --tw-bg:#13312A; --hk-bg:#16233D; --mo-bg:#3B2A14;
  --g-Taiwan:linear-gradient(140deg,#0B6B54 0%,#1E9C7D 100%);
  --g-HongKong:linear-gradient(140deg,#1B43A8 0%,#3F72D8 100%);
  --g-Macau:linear-gradient(140deg,#A85500 0%,#D98A2B 100%);
  --shadow:0 8px 28px rgba(0,0,0,.35); --nav-bg:rgba(20,27,39,.82);
  --mesh:radial-gradient(700px 420px at 6% -8%,rgba(30,156,125,.22),transparent 62%),radial-gradient(640px 420px at 100% 0%,rgba(63,114,216,.2),transparent 60%),radial-gradient(600px 400px at 60% 112%,rgba(217,138,43,.12),transparent 60%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1018; --surface:#141B27; --fg:#EEF1F7; --muted:#93A0B8; --line:#242E3F;
  --accent:#EEF1F7; --accent-fg:#0B1018; --link:#82AFFF; --danger:#FF8F87; --warn:#F3C46F; --warn-bg:#3A2F14; --soft:#1B2433;
  --tw:#4DD2AA; --hk:#82AFFF; --mo:#F4AE5E; --tw-bg:#13312A; --hk-bg:#16233D; --mo-bg:#3B2A14;
  --g-Taiwan:linear-gradient(140deg,#0B6B54 0%,#1E9C7D 100%);
  --g-HongKong:linear-gradient(140deg,#1B43A8 0%,#3F72D8 100%);
  --g-Macau:linear-gradient(140deg,#A85500 0%,#D98A2B 100%);
  --shadow:0 8px 28px rgba(0,0,0,.35); --nav-bg:rgba(20,27,39,.82);
  --mesh:radial-gradient(700px 420px at 6% -8%,rgba(30,156,125,.22),transparent 62%),radial-gradient(640px 420px at 100% 0%,rgba(63,114,216,.2),transparent 60%),radial-gradient(600px 400px at 60% 112%,rgba(217,138,43,.12),transparent 60%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--mesh);background-attachment:fixed;color:var(--fg);font:16px/1.5 var(--body);margin:0;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.12;text-wrap:balance}
h2{font-size:22px;line-height:1.2}
h3{font-size:16px}
button,input,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.muted{color:var(--muted);font-size:14px}
a{color:var(--link)}
/* header */
.hd{padding:26px 2px 14px}
.kick{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.back{display:flex;align-items:center;gap:6px;padding:20px 0 10px}
.back button{display:flex;align-items:center;gap:4px;border:0;background:var(--soft);color:var(--fg);font:600 14px var(--body);padding:9px 14px 9px 10px;border-radius:999px;cursor:pointer}
.back h2{margin-left:8px}
/* cards */
.card{background:var(--surface);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{justify-content:space-between}
input,select,textarea{font-size:16px;color:var(--fg);background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;min-width:0}
input[type=text],input[type=number],input[type=date]{flex:1 1 120px}
input:focus,textarea:focus,select:focus{border-color:var(--link);outline:none}
textarea{width:100%;resize:vertical}
.btn{font:700 15px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;min-height:46px}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.sm{padding:9px 16px;min-height:38px;font-size:14px}
.btn.wide{width:100%}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;padding:6px 10px;line-height:1;border-radius:10px}
.x:hover{color:var(--danger)}
.pill{display:inline-block;font:700 12px var(--body);letter-spacing:.04em;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff}
.pill.ghost{background:rgba(255,255,255,.14)}
.tag{display:inline-block;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.tag.Taiwan{background:var(--tw-bg);color:var(--tw)} .tag.HongKong{background:var(--hk-bg);color:var(--hk)} .tag.Macau{background:var(--mo-bg);color:var(--mo)} .tag.today{background:var(--accent);color:var(--accent-fg)}
.g-Taiwan{background:var(--g-Taiwan)} .g-HongKong{background:var(--g-HongKong)} .g-Macau{background:var(--g-Macau)}
/* hero */
.hero{border-radius:28px;padding:22px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero-k{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:16px}
.hero-t{font:700 22px/1.25 var(--display);margin:6px 0 4px;overflow-wrap:anywhere}
.hero-s{opacity:.9;font-size:14px}
.hero .big{font:700 76px/1 var(--display);margin:6px 0 0}
.hero-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .btn{background:#fff;color:#0F1729}
.hero .btn.ghost{background:rgba(255,255,255,.2);color:#fff}
.hero a.btn{text-decoration:none;display:inline-flex;align-items:center}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qb{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 6px;font:600 12px var(--body);color:var(--fg);cursor:pointer;box-shadow:var(--shadow);text-align:center}
.qi{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
/* check list / timeline */
.st{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.ck{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--accent-fg);padding:0;margin-top:1px}
.ck.on{background:var(--accent);border-color:var(--accent)}
.stb{flex:1;min-width:0;overflow-wrap:anywhere}
.stt{font:700 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.st.done .stb{opacity:.5;text-decoration:line-through}
.maplink{color:var(--link);font:700 13px var(--body);white-space:nowrap}
/* weather */
.wx{display:flex;gap:14px;align-items:center}
.wx-ic{width:52px;height:52px;border-radius:18px;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.wx b{font:700 24px var(--display)}
/* day strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:62px;border:2px solid transparent;background:var(--surface);border-radius:20px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow);scroll-snap-align:center}
.dchip small{font:600 11px var(--body);color:var(--muted);text-transform:uppercase}
.dchip b{font:700 22px var(--display)}
.dchip i{width:8px;height:8px;border-radius:50%;margin-top:2px}
.dchip.on{background:var(--accent);color:var(--accent-fg)}
.dchip.on small{color:inherit;opacity:.75}
.dchip.on i{box-shadow:0 0 0 2px var(--accent-fg)}
.dchip.now{border-color:var(--link)}
.dhead{border-radius:28px;padding:20px;color:#fff;margin-bottom:12px;box-shadow:var(--shadow)}
.dt{font:700 26px/1.15 var(--display);margin:14px 0 4px;text-wrap:balance}
.dhead .mini{opacity:.92;font-size:14px}
.booked{background:var(--tw-bg);color:var(--fg);border-radius:14px;padding:10px 14px;margin:0 0 8px;font-size:14px;overflow-wrap:anywhere}
.booked b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tw);margin-right:6px}
.heads{background:var(--warn-bg);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;overflow-wrap:anywhere}
.heads b{color:var(--warn)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:14px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:999px;font:700 14px var(--body);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(15,23,41,.12)}
.leg2 p{margin:6px 0 0;font-size:15px;overflow-wrap:anywhere}
.leg2 .m{color:var(--muted);font-size:14px}
.tg{font:700 11px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tg.need{background:var(--warn-bg);color:var(--warn)} .tg.free{background:var(--tw-bg);color:var(--tw)}
.list{margin:8px 0 0;padding-left:20px}
.list li{margin-bottom:6px;overflow-wrap:anywhere}
.sec{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
/* money */
.total{font:700 34px var(--display);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--g-Taiwan);border-radius:99px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:0;background:var(--soft);color:var(--fg);padding:10px 16px;border-radius:999px;font:700 14px var(--body);cursor:pointer;min-height:42px}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.amt{font:700 30px var(--display);width:100%;text-align:left;padding:14px 16px}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.conv div{background:var(--soft);border-radius:16px;padding:12px}
.conv b{display:block;font:700 20px var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.conv span{font-size:12px;color:var(--muted)}
.exp{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exp .d{flex:1;min-width:0;overflow-wrap:anywhere}
.exp .a{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rates label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
/* more tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow);min-height:132px}
.tile .qi{margin-bottom:4px}
.tile b{font:700 16px var(--display)}
.tile span{font-size:13px;color:var(--muted)}
/* bottom bar */
.bar-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 34px rgba(15,23,41,.18);width:min(420px,calc(100vw - 24px))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font:700 11px var(--body);padding:8px 4px;border-radius:999px;cursor:pointer;min-height:54px}
.nv.on{background:var(--accent);color:var(--accent-fg)}
/* shared pieces used by the More pages */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{color:var(--muted);font-variant-numeric:tabular-nums;width:60px;flex:0 0 60px;font-size:13px;padding-top:2px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{margin-top:3px;width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.group-title{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.phrase .en{font-weight:600}
.phrase .han{font:500 22px var(--han)}
.phrase .rom{color:var(--muted);font-size:13px}
.phrase button{grid-row:1/3;grid-column:2}
.tips{display:grid;grid-template-columns:1fr;gap:14px}
.tips .card{margin:0}
.tips ul{margin:8px 0 0;padding-left:20px}
.tips li{margin-bottom:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14px}
th,td{text-align:left;padding:10px;border-top:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{font-weight:700;background:var(--tw-bg)}
.ref{font-size:12px;color:var(--muted);overflow-wrap:anywhere;user-select:all}
details.g{margin:8px 0;border:1px solid var(--line);border-radius:16px;background:var(--soft)}
details.g>summary{cursor:pointer;font:700 14px var(--body);padding:12px 14px;list-style:none;display:flex;gap:8px;align-items:center}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::before{content:"▸";color:var(--muted)}
details.g[open]>summary::before{content:"▾"}
.leg{padding:10px 14px;border-top:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.leg b{display:block;font-size:15px}
.leg .m{color:var(--muted)}
.near{margin:0;padding:8px 14px 12px 32px;border-top:1px solid var(--line);font-size:14px}
.near li{margin-bottom:4px}
.daynote{min-height:96px;display:block;margin:0}
.daynote[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 90px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font:600 14px var(--body);opacity:0;pointer-events:none;z-index:30;transition:opacity .2s;max-width:90vw;text-align:center}

.pimg{flex:0 0 auto;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--muted);overflow:hidden;text-decoration:none}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.xp .xb{flex:1}
/* weather rows, nearby ideas, side panel */
.fr{display:grid;grid-template-columns:92px 84px 1fr;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.fr:first-of-type{border-top:0}
.fr .fd{font-weight:600}
.fr .muted{font-size:12px}
.rb{grid-column:1/-1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.rb i{display:block;height:100%;background:var(--g-HongKong);border-radius:99px}
.xp{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.xp:first-of-type{border-top:0}
.xb{min-width:0;overflow-wrap:anywhere}
.xb b{font-size:15px}
.xa{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.aside{display:none}
.brand{display:none}
@media (min-width:1024px){
  body{padding-block:28px 40px}
  .layout{display:grid;grid-template-columns:96px minmax(0,700px) 360px;width:100%;gap:32px;justify-content:center;align-items:start}
  .bar-nav{position:sticky;top:28px;left:auto;bottom:auto;transform:none;flex-direction:column;width:auto;border-radius:32px;padding:10px;gap:6px}
  .brand{display:grid;place-items:center;width:52px;height:52px;margin:4px auto 10px;border-radius:18px;background:var(--g-Taiwan);color:#fff;font:700 18px var(--display)}
  .nv{min-height:70px;padding:10px 6px;font-size:12px}
  .wrap{max-width:none;min-width:0;margin:0}
  .wrap main{min-width:0}
  .strip{max-width:100%}
  .layout.noaside{grid-template-columns:96px minmax(0,700px)}
  .layout.noaside .aside{display:none}
  .aside{display:block;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto;padding:0 2px 12px;scrollbar-width:thin}
  .m-only{display:none!important}
  .toast{bottom:32px}
  .hd{padding-top:6px}
  .tips{grid-template-columns:1fr 1fr}
}

/* print layout: only the printable itinerary shows when printing */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;background-image:none!important;color:#000!important}
  body{padding:0!important;margin:0!important;font:11px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}
  body::before{display:none!important}
  .layout,.toast{display:none!important}
  #printRoot{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-head{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .pr-head h1{font:700 20px system-ui,sans-serif;margin:0}
  .pr-sub{font-size:11px;color:#333;margin-top:2px}
  .pr-day{break-inside:avoid;page-break-inside:avoid;border-left:5px solid #777;padding:4px 0 4px 10px;margin:0 0 10px}
  .pr-Taiwan{border-left-color:#0a8f6e}.pr-HongKong{border-left-color:#2457d6}.pr-Macau{border-left-color:#c26400}
  .pr-day h2{font:700 13px system-ui,sans-serif;margin:0}
  .pr-title{font-weight:600;margin:1px 0 4px}

// Shows the rupee value beside any NT$, HK$, MOP, TWD or HKD amount, using the current rates (live when the hosted app has them).
const AMT_RE=/(NT\$|HK\$|\bMOP\b|\bTWD\b|\bHKD\b)\s?(\d(?:[\d,]*\d)?(?:\.\d+)?)(?:\s?[–-]\s?(\d(?:[\d,]*\d)?(?:\.\d+)?))?(\+)?/g;
function inrify(str){
  try{
    if(typeof str!=='string'||!/NT\$|HK\$|MOP|TWD|HKD/.test(str))return str;
    return str.replace(AMT_RE,(m,cur,a,b,plus)=>{
      const code=cur==='NT$'||cur==='TWD'?'TWD':cur==='HK$'||cur==='HKD'?'HKD':'MOP';
      const r=S.rates[code];if(!(r>0))return m;
      const v=x=>Math.round(parseFloat(x.replace(/,/g,''))*r).toLocaleString('en-IN');
      return m+' (≈ ₹'+v(a)+(b?'–'+v(b):'')+(plus?'+':'')+')';
    });
  }catch(e){return str}
}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(typeof c==='string'?inrify(c):c))}
  return e;
}
const fmt=(n,d=2)=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});

const rateOf=c=>c==='HOME'?1:S.rates[c];          // home units per 1 unit of c

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);

function countdown(){
  const t=today(), el=document.getElementById('count');
  const toGo=dayDiff(t,TRIP_START);
  if(toGo>0)el.textContent=toGo+' days to go · 21 days away';
  else if(dayDiff(t,TRIP_END)>=0)el.textContent='Day '+(1-toGo)+' of 21';
  else el.textContent='Trip complete';
}

const b64=bytes=>{let s='';bytes.forEach(b=>{s+=String.fromCharCode(b)});return btoa(s)};
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function gz(data,mode){
  const cs=mode==='c'?new CompressionStream('gzip'):new DecompressionStream('gzip');
  const w=cs.writable.getWriter();w.write(typeof data==='string'?new TextEncoder().encode(data):data);w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function exportPriv(){
  const dayBookings={};S.days.forEach(d=>{if(d.bookings&&d.bookings.length)dayBookings[d.iso]=d.bookings});
  const json=JSON.stringify({v:2,bookings:BOOKINGS,lodging:LODGING,dayBookings,planV:3,days:S.days,budget:S.budget,notes:S.notes||'',todo:S.todo,addr:S.addr||{},info:S.info||{},tix:S.tix||{}});
  try{if(window.CompressionStream)return 'TK1:'+b64(await gz(json,'c'))}catch(e){}
  return json;
}
async function importPriv(text){
  text=text.trim();let json=text;
  if(text.startsWith('TK1:'))json=new TextDecoder().decode(await gz(unb64(text.slice(4)),'d'));
  const p=JSON.parse(json);
  if(!p||(p.v!==1&&p.v!==2)||!Array.isArray(p.bookings)||!Array.isArray(p.lodging))throw new Error('bad');
  S.priv={bookings:p.bookings,lodging:p.lodging,dayBookings:p.dayBookings||{}};
  if(p.planV===3&&Array.isArray(p.days)&&p.days.length){
    const done={};S.days.forEach(d=>d.items.forEach(i=>{if(i.done)done[d.iso+i.text]=1}));
    p.days.forEach(d=>d.items.forEach(i=>{if(done[d.iso+i.text])i.done=true}));
    S.days=p.days;
  }
  if(p.budget&&p.budget.low>0&&p.budget.high>0)S.budget=p.budget;
  if(typeof p.notes==='string'&&p.notes&&!S.notes){S.notes=p.notes;const nt=document.getElementById('noteText');if(nt)nt.value=S.notes}
  if(Array.isArray(p.todo))S.todo=p.todo;
  S.addr=Object.assign(S.addr||{},p.addr||{});S.info=Object.assign(S.info||{},p.info||{});
  if(p.tix)S.tix=Object.assign(S.tix||{},p.tix);

}

  while(imgActive<3&&imgQueue.length){
    const job=imgQueue.shift();imgActive++;

async function findImg(q){
  const url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=3&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=200&format=json&origin=*';
  const j=await getJson(url);const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||9)-(b.index||9));
  const want=toks(q);
  for(const pg of pages){
    if(!pg.thumbnail)continue;
    const have=new Set(toks(pg.title));
    if(want.length&&!want.some(w=>have.has(w)))continue;   // only accept a page whose title shares a distinctive word with the place
    return {u:pg.thumbnail.source,t:pg.title,w:pg.fullurl||''};
  }
  return null;
}

}

function loadThumb(box){
  const q=box.dataset.q,rec=IMGC[q];
  if(rec){showImg(box,rec);return}
  if(rec===0||!window.__PUBLIC__||navigator.onLine===false)return;
  imgQueue.push({q,cb:r=>showImg(box,r)});imgNext();
}

}

const SEASON={'Taipei':{lo:12,hi:19,rain:3},'Taitung':{lo:16,hi:24,rain:0},'Green Island':{lo:19,hi:24,rain:1,wind:1},'Macau':{lo:12,hi:19,rain:0},'Hong Kong':{lo:14,hi:19,rain:0}};
function packStats(){
  const by={};
  tripDays().forEach(d=>{
    const k=wxKey(d.iso,d.city),b=by[k]=by[k]||{days:0,lo:99,hi:-99,rain:0,gust:0,fc:0,hist:0};
    b.days++;

    if(w){b.fc++;b.lo=Math.min(b.lo,w.tmin);b.hi=Math.max(b.hi,w.tmax);if(w.pop>=60)b.rain++;b.gust=Math.max(b.gust,w.gust||0)}

  });
  Object.entries(by).forEach(([k,b])=>{

function clockInfo(){

}

}

async function onPos(pos){

function loadLeaflet(){

const lon2x=(lo,z)=>Math.floor((lo+180)/360*Math.pow(2,z));
const lat2y=(la,z)=>{const r=la*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z))};
// ---------- save a day's map for offline use (you press the button; about 100 to 250 small tiles) ----------
async function saveDayOffline(d,pts,statusEl){
  if(!('caches' in window)){toast('Offline saving is not supported in this browser');return}
  const urls=new Set();
  const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lon);
  [12,13,14].forEach(z=>{
    const x0=lon2x(Math.min(...lons),z),x1=lon2x(Math.max(...lons),z),y0=lat2y(Math.max(...lats),z),y1=lat2y(Math.min(...lats),z);
    if((x1-x0+1)*(y1-y0+1)<=60)for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)urls.add('https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png');
  });
  pts.forEach(p=>[15,16].forEach(z=>{const cx=lon2x(p.lon,z),cy=lat2y(p.lat,z);for(let x=cx-1;x<=cx+1;x++)for(let y=cy-1;y<=cy+1;y++)urls.add('https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png')}));
  const list=[...urls].slice(0,300);
  const c=await caches.open('trip-tiles-v1');
  let done=0,fail=0,i=0;
  const lib=['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'];
  for(const u of lib){try{if(!(await c.match(u)))await c.put(u,await fetch(u))}catch(e){}}
  async function worker(){
    while(i<list.length){
      const u=list[i++];
      try{if(!(await c.match(u))){const r=await fetch(u,{mode:'no-cors'});await c.put(u,r)}done++}catch(e){fail++}
      if(statusEl)statusEl.textContent='Saving the map for offline: '+(done+fail)+' of '+list.length;
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.packed=S.packed||{};S.packed[d.iso]=Date.now();save();
  if(statusEl)statusEl.textContent=fail?'Saved most of the map ('+fail+' tiles failed). Try again on Wi-Fi.':'Saved. This day\'s map now opens without signal.';
}

function wOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('trip-wallet',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function wPut(rec){const db=await wOpen();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function wDel(id){const db=await wOpen();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

    S.rem.on=on.checked;save();toast(S.rem.on?'Reminders on while the app is open':'Reminders off');
  });

async function pushNote(title,body,tag){
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon-192.png'});return}}catch(e){}
  try{new Notification(title,{body,tag})}catch(e){}
}
function remTick(){
  if(!S.rem||!S.rem.on||!('Notification' in window)||Notification.permission!=='granted')return;
  const day=curDay();if(!day)return;
  S.remSent=S.remSent||{};const n=new Date(),nm=n.getHours()*60+n.getMinutes(),k=today();
  if(S.rem.morning!==false&&nm>=7*60&&!S.remSent['m'+k]){
    S.remSent['m'+k]=1;const first=visibleItems(day).find(i=>!i.done);
    pushNote('Today: '+day.title,first?('First up: '+(first.time?first.time+' ':'')+first.text):'No stops planned today','morning-'+k);save();
  }
  visibleItems(day).forEach(it=>{
    const m=/^(\d{1,2}):(\d{2})/.exec(it.time||'');if(!m||it.done)return;
    const t=+m[1]*60+ +m[2],key='l'+k+it.id;
    if(!S.remSent[key]&&nm>=t-S.rem.lead&&nm<t){S.remSent[key]=1;pushNote('Leave soon: '+(it.time||''),it.text,key);save()}
  });
}

function wxRows(key,iso){
  const rows=[];
  for(let k=0;k<5;k++){
    const d=addDays(iso,k);
    const f=LIVE.wx&&LIVE.wx[key]&&LIVE.wx[key][d];
    const hs=LIVE.hist&&LIVE.hist[key]&&LIVE.hist[key][d.slice(5)];
    if(f)rows.push({d,tmin:f.tmin,tmax:f.tmax,pop:f.pop,src:'forecast'});
    else if(hs)rows.push({d,tmin:hs.tmin,tmax:hs.tmax,pop:null,rain:hs.rain,src:'last year'});
  }
  return rows;
}
function forecastPanel(day,extra){

  const rows=wxRows(key,iso);
  if(rows.length){
    rows.forEach(r=>{
      const rainTxt=r.pop!=null?'Rain '+r.pop+'%':(r.rain!=null?r.rain.toFixed(1)+' mm last year':'');
      const w=r.pop!=null?r.pop:Math.min(100,(r.rain||0)*20);
      card.append(h('div',{class:'fr'},h('span',{class:'fd'},wd(r.d)),h('b',null,Math.round(r.tmin)+'–'+Math.round(r.tmax)+'°C'),h('span',{class:'muted'},rainTxt),h('div',{class:'rb','aria-hidden':'true'},h('i',{style:'width:'+w+'%'}))));
    });
    const anyF=rows.some(r=>r.src==='forecast');
    card.append(h('p',{class:'muted',style:'margin:10px 0 0'},anyF?'Live forecast, updated '+ago(LIVE.wxAt)+'. Rows marked "last year" show how the same date felt in 2025.':'These are the same dates last year. The live forecast opens about 16 days ahead, around '+fdate(addDays(iso,-16))+'.'));
  }else{
